[package]
name = "express-trainer"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "express_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
sherpa-onnx = "1.13"
# API Key 安全存储（Windows 原生凭据管理器；keyring v3 平台后端需显式启用）
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 应用内模型下载（M4 首启引导）：release 归档为 tar.bz2
bzip2 = { version = "0.4", features = ["static"] }
tar = "0.4"
# 从文件练习：mp3/flac/m4a 等解码（纯 Rust、无 C 依赖；wav 走自研 RIFF 解析）
symphonia = { version = "0.5", default-features = false, features = [
    "pcm",
    "mp3",
    "flac",
    "isomp4",
    "aac",
    "wav",
] }

[dev-dependencies]
tempfile = "3"

