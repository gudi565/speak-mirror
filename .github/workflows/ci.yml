name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: express-trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: express-trainer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          working-directory: express-trainer/src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 前端测试
        run: npm test
      - name: TypeScript 检查
        run: npx tsc --noEmit
      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: express-trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: express-trainer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          working-directory: express-trainer/src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 构建安装包
        run: npm run tauri build
      - name: 挂载到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: express-trainer/src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: express-trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: express-trainer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"
      - uses: swatinem/rust-cache@v2
        with:
          working-directory: express-trainer/src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 构建 macOS 通用安装包（Apple Silicon + Intel）
        run: npm run tauri build -- --target universal-apple-darwin
      - name: 挂载到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: express-trainer/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
